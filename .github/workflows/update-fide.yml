name: Auto Update FIDE Ratings

on:
  schedule:
    - cron: '0 0 1 * *' # Автоматично на всеки 1-ви ден от месеца
  workflow_dispatch: # Бутон за ръчно пускане

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Scraper Dependencies
        run: pip install beautifulsoup4 requests

      - name: Fetch FIDE Ratings and Update HTML
        run: |
          python -c "
          import requests
          import re
          from bs4 import BeautifulSoup

          url = 'https://ratings.fide.com/profile/2961547'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          }

          print('Свързване с FIDE...')
          res = requests.get(url, headers=headers)
          
          if res.status_code != 200:
              print(f'Грешка: FIDE върна статус {res.status_code}')
              exit(1)

          soup = BeautifulSoup(res.text, 'html.parser')
          
          # Извличане на целия чист текст от страницата, изчистен от излишни разстояния
          page_text = ' '.join(soup.get_text(separator=' ').split()).lower()

          std, rapid, blitz = '0', '0', '0'

          # Търсене на числата около съответните ключови думи (преди или след тях)
          std_match = re.search(r'(\d{3,4})\s*standard|standard\s*(\d{3,4})', page_text)
          rapid_match = re.search(r'(\d{3,4})\s*rapid|rapid\s*(\d{3,4})', page_text)
          blitz_match = re.search(r'(\d{3,4})\s*blitz|blitz\s*(\d{3,4})', page_text)

          if std_match:
              std = std_match.group(1) or std_match.group(2)
          if rapid_match:
              rapid = rapid_match.group(1) or rapid_match.group(2)
          if blitz_match:
              blitz = blitz_match.group(1) or blitz_match.group(2)

          # Крайна проверка на намерените данни
          if std == '0' or rapid == '0' or blitz == '0':
              print('Грешка: Неуспешно разчитане на текстовите полета за рейтинг.')
              exit(1)

          print(f'УСПЕХ! Намерени нови рейтинги -> STD: {std}, RAPID: {rapid}, BLITZ: {blitz}')

          # Четене и актуализация на index.html
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          html = re.sub(r'.*?', f'{std}', html)
          html = re.sub(r'.*?', f'{rapid}', html)
          html = re.sub(r'.*?', f'{blitz}', html)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "FIDE Rating Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Автоматично обновяване на FIDE рейтингите" && git push)
