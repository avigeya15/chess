name: Auto Update FIDE Ratings

on:
  schedule:
    - cron: '0 0 1 * *' # Автоматично на всеки 1-ви ден от месеца
  workflow_dispatch: # Бутон за ръчно пускане

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch FIDE Ratings and Update HTML
        run: |
          python -c "
          import requests
          import re

          url = 'https://ratings.fide.com/profile/2961547'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          }

          print('Свързване с FIDE...')
          res = requests.get(url, headers=headers)
          if res.status_code != 200:
              print('Грешка при връзка с FIDE')
              exit(1)

          # Превръщаме HTML в изчистен текст само за откриване на рейтингите
          clean_text = re.sub('<[^<]+?>', ' ', res.text).lower()
          clean_text = ' '.join(clean_text.split())

          std, rapid, blitz = '0', '0', '0'
          std_match = re.search(r'(\d{3,4})\s*standard|standard\s*(\d{3,4})', clean_text)
          rapid_match = re.search(r'(\d{3,4})\s*rapid|rapid\s*(\d{3,4})', clean_text)
          blitz_match = re.search(r'(\d{3,4})\s*blitz|blitz\s*(\d{3,4})', clean_text)

          if std_match: std = std_match.group(1) or std_match.group(2)
          if rapid_match: rapid = rapid_match.group(1) or rapid_match.group(2)
          if blitz_match: blitz = blitz_match.group(1) or blitz_match.group(2)

          if std == '0' or rapid == '0' or blitz == '0':
              print('Неуспешно извличане на рейтингите.')
              exit(1)

          print(f'УСПЕХ! Намерени рейтинги -> STD: {std}, RAPID: {rapid}, BLITZ: {blitz}')

          # Отваряме index.html като чист текст, БЕЗ да пренареждаме структурата му
          with open('index.html', 'r', encoding='utf-8') as f:
              index_text = f.read()

          # Хирургическа подмяна само на числата вътре в съответните ID-та
          index_text = re.sub(r'(id=\"rate-std\"[^>]*>)\d+(</div>)', r'\g<1>' + str(std) + r'\2', index_text)
          index_text = re.sub(r'(id=\"rate-rap\"[^>]*>)\d+(</div>)', r'\g<1>' + str(rapid) + r'\2', index_text)
          index_text = re.sub(r'(id=\"rate-blz\"[^>]*>)\d+(</div>)', r'\g<1>' + str(blitz) + r'\2', index_text)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_text)
          print('Файлът index.html е обновен успешно без промяна на дизайна!')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "FIDE Rating Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Автоматично обновяване на FIDE рейтингите" && git push)
